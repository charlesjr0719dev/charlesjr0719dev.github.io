<meta name="viewport" content="width=device-width,initial-scale=1">

<title>早安信</title>
<style>:root{--paper:#f5f2e9;--ink:#1a1a18;--soft:#6b675c;--rule:#cfc9b8;--mark:#b9502f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
 font-family:"Songti TC","Noto Serif TC",Georgia,"PingFang TC",serif;-webkit-font-smoothing:antialiased}
a.cue{font-size:11px;letter-spacing:.1em;color:var(--mark);text-decoration:none;
 border:1px solid currentColor;border-radius:2px;padding:0 5px;margin:0 3px;
 text-indent:0;display:inline-block;line-height:1.5;vertical-align:1px}
a.cue:hover{background:var(--mark);color:var(--paper)}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;background:#e7e1d0;
 border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;
 font-size:17px;color:var(--soft)}

.page{max-width:1000px;margin:0 auto;padding:46px 34px 90px}
.sheet{display:grid;grid-template-columns:34fr 62fr;gap:46px;align-items:start}
figure.plate{margin:0;position:sticky;top:34px}
figure.plate img{display:block;width:100%;border:1px solid var(--rule)}
figure.plate figcaption{font-size:11.5px;letter-spacing:.16em;color:var(--soft);
 text-align:center;margin-top:10px}
.letter{font-size:17px;line-height:1.95}
.initial{float:left;width:86px;height:86px;margin:2px 18px 6px 0;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 font-size:44px;line-height:1;background:#efe9d8;
 border:1px solid var(--ink);
 box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--ink)}
.initial img{width:100%;height:100%;object-fit:cover;display:block}
.who{font-size:17px;letter-spacing:.14em;padding-bottom:9px;margin-bottom:16px;
 border-bottom:1px solid var(--rule)}
.who .date{float:right;font-size:12px;letter-spacing:.2em;color:var(--soft);
 padding-top:5px}
.letter p{margin-bottom:1.05em;text-align:justify}
.letter p.sign{text-align:right;font-size:19px;letter-spacing:.3em;margin-top:26px}
@media(max-width:760px){.page{padding:24px 18px 64px}
 .sheet{grid-template-columns:1fr;gap:20px}
 figure.plate{position:static}
 figure.plate img{width:auto;max-width:100%;max-height:40vh;margin:0 auto}
 figure.plate figcaption{margin-top:8px}
 .letter{font-size:16.5px}
 .initial{width:70px;height:70px;font-size:36px;margin:2px 14px 4px 0}
 .who{font-size:16px;padding-bottom:7px;margin-bottom:14px;
  display:flex;align-items:baseline;flex-wrap:wrap;column-gap:12px;row-gap:2px}
 .who .date{float:none;order:2;font-size:11px;letter-spacing:.14em;padding-top:0}}

#locked{max-width:460px;margin:22vh auto;padding:0 24px;
 font-family:"Songti TC","Noto Serif TC",Georgia,serif;color:#6b675c;
 font-size:15px;line-height:2;letter-spacing:.08em;text-align:center}</style>
</head><body>
